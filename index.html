<!DOCTYPE html>
<html lang="en" data-theme="dark" data-mode="focus">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070708">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flywheel">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Flywheel — Concept2 PM5 live data</title>
<script src="core/prepaint.js"></script>
<script defer src="vendor/plotly-4.2.0.min.js"></script>
<link rel="stylesheet" href="core/ui.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <circle cx="16" cy="16" r="12.5"/><circle cx="16" cy="16" r="2.6"/>
        <path d="M16 13.4c2.6-2.6 3.6-5.2 3-8.4"/><path d="M18.25 17.3c3.55.95 6.3.5 8.75-1.6"/><path d="M13.75 17.3c-.95 3.55-2.85 5.6-5.9 6.7"/>
      </svg>
      <span>Flywheel</span>
    </div>
    <nav class="tabs" role="tablist">
      <button data-view="live" class="active">Live</button>
      <button data-view="history">History</button>
      <button data-view="about">About</button>
    </nav>
    <button class="icon" id="settingsBtn" aria-label="Display settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
    <button class="btn primary" id="connectBtn"><span class="norm">Connect</span><span class="conf">Disconnect?</span></button>
  </header>

  <div id="bleNotice" class="notice" hidden></div>

  <main>
    <section class="view" id="view-live"></section>
    <section class="view" id="view-history"></section>
    <section class="view" id="view-about"></section>
  </main>
</div>

<dialog id="settings">
  <h3>Display</h3>
  <div class="field"><div class="eyebrow">Theme</div>
    <div class="seg" data-pref="theme"><button type="button" value="system">Auto</button><button type="button" value="light">Light</button><button type="button" value="dark">Dark</button></div></div>
  <div class="field"><div class="eyebrow">Accent</div><div class="swatches" id="swatches"></div></div>
  <div class="field"><div class="eyebrow">Layout</div>
    <div class="seg" data-pref="layout"><button type="button" value="auto">Auto</button><button type="button" value="focus">One at a time</button><button type="button" value="grid">Dashboard</button></div></div>
  <div class="dlg-foot">
    <button type="button" class="btn danger" id="discardBtn" disabled><span class="norm">Discard session</span><span class="conf">Tap to discard</span></button>
    <button type="button" class="btn primary" id="closeSettings">Done</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
