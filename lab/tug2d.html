<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><title>tug — sculls mock</title>
<script>localStorage.setItem("flywheel.prefs", JSON.stringify({ theme: "dark", accent: "cyan" }));</script><script src="../core/prepaint.js"></script>
<link rel="stylesheet" href="../core/ui.css">
<style>html,body{margin:0;height:100%;background:var(--page)} #host{position:absolute;inset:0} svg{display:block;width:100%;height:100%}
.tg-line{stroke:var(--accent);stroke-width:.06} .tg-glow{fill:var(--accent);opacity:.12} .tg-rope{fill:none;stroke:#c9b58c;stroke-width:.07;stroke-linecap:round}
.tg-mark{fill:var(--accent)} .tg-m{stroke:color-mix(in srgb,var(--ink) 25%,transparent);stroke-width:.05} .tg-n{fill:var(--muted);font-family:var(--mono)}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:22px 26px;color:var(--ink);font-family:var(--font)}
.hud .big{font-size:56px;font-weight:500;letter-spacing:-.03em;color:var(--accent);text-shadow:var(--glow)} .hud .k{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
</style></head><body><div id="host"></div>
<div class="hud"><div><div class="k">Tug of war</div><div style="font-size:20px;font-weight:600;margin-top:6px">vs Best 2k <span style="color:var(--muted);font-weight:500">· 1:52.4 /500m</span></div></div><div style="text-align:right"><div class="big" id="lead"></div><div class="k" id="leadk"></div></div></div>
<script type="module">
import { buildBoat } from '../screens/panels/boat.js';
const NS = 'http://www.w3.org/2000/svg', mk = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (p) p.appendChild(e); return e; };
const q = new URLSearchParams(location.search), shift = +(q.get('shift') || 0), lead = +(q.get('lead') || 0);
document.getElementById('lead').textContent = `${lead >= 0 ? '+' : '−'}${Math.abs(lead).toFixed(1)} m`; document.getElementById('leadk').textContent = lead >= 0 ? 'ahead' : 'behind';
const host = document.getElementById('host'), W = innerWidth, H = innerHeight, vert = H > W;
const svg = mk('svg', { viewBox: `0 0 ${W} ${H}` }, host);
mk('rect', { x: 0, y: 0, width: W, height: H, class: 'pb-water' }, svg);
const ROPE = 7, HULL = 8.2, span = 2 * (ROPE / 2 + HULL) + 4, k = (vert ? H : W) / span;   // the view follows the rig, so the line moves
const cx = -shift * 0.75;
const world = mk('g', { transform: vert ? `translate(${W / 2},${H / 2 + 20 - cx * k}) rotate(-90) scale(${k})` : `translate(${W / 2 - cx * k},${H / 2 + 30}) scale(${k})` }, svg);
// ripples, metre marks from the centre line, the lit line
for (let i = 0; i < 70; i++) { const x = ((i * 7.31) % 40) - 20, y = ((i * 3.77) % 9) - 4.5; mk('line', { x1: x, y1: y, x2: x + 0.6 + (i % 3) * 0.4, y2: y, class: 'pb-ripple', 'stroke-width': 0.04 }, world); }
for (let m = -10; m <= 10; m++) if (m) mk('line', { x1: m, x2: m, y1: m % 5 ? -0.25 : -0.5, y2: m % 5 ? 0.25 : 0.5, class: 'tg-m' }, world);
mk('rect', { x: -0.4, y: -4.5, width: 0.8, height: 9, class: 'tg-glow' }, world); mk('line', { x1: 0, x2: 0, y1: -4.5, y2: 4.5, class: 'tg-line' }, world);
// two sculls, stern to stern, bows pulling away from each other; rope between the sterns
const me = buildBoat(world, false), opp = buildBoat(world, true);
const sternMe = -ROPE / 2 - shift, sternOpp = ROPE / 2 - shift;
me.g.setAttribute('transform', `translate(${sternMe - HULL / 2},0) scale(-1,1) scale(-1,1) rotate(180)`);
opp.g.setAttribute('transform', `translate(${sternOpp + HULL / 2},0)`);
me.pose(0.55, true); opp.pose(0.2, true);
mk('path', { d: `M${sternMe},0 Q${(sternMe + sternOpp) / 2},0.12 ${sternOpp},0`, class: 'tg-rope' }, world);
mk('circle', { cx: (sternMe + sternOpp) / 2, cy: 0.04, r: 0.16, class: 'tg-mark' }, world);
window.__ready = true;
</script></body></html>
