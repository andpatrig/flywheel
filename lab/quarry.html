<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Quarry — look-dev</title>
<script src="../core/prepaint.js"></script>
<script>
  (function () { var p = {}; try { p = JSON.parse(localStorage.getItem('flywheel.prefs') || '{}'); } catch (e) {}
    var a = window.FW_ACCENTS[p.accent] || window.FW_ACCENTS.cyan, r = document.documentElement;
    r.dataset.theme = 'dark'; r.style.setProperty('--accent', a.d); })();
</script>
<link rel="stylesheet" href="../core/ui.css">
<style>
  html, body { background: #0a0908; }
  #stage { position: fixed; inset: 0; }
  .hud { position: fixed; inset: 0; pointer-events: none; color: #f2f2f0; z-index: 1; isolation: isolate;
    padding: calc(env(safe-area-inset-top, 0px) + 1.25rem) calc(env(safe-area-inset-right, 0px) + 1.5rem) calc(env(safe-area-inset-bottom, 0px) + 1.25rem) calc(env(safe-area-inset-left, 0px) + 1.5rem);
    display: grid; grid-template-rows: auto 1fr auto; text-shadow: 0 1px 12px rgba(0,0,0,0.45); }
  .hud::before, .hud::after { content: ''; position: fixed; left: 0; right: 0; pointer-events: none; z-index: -1; }
  .hud::before { top: 0; height: 9rem; background: linear-gradient(rgba(6,5,4,0.6), rgba(6,5,4,0)); }
  .hud::after { bottom: 0; height: 7rem; background: linear-gradient(rgba(6,5,4,0), rgba(6,5,4,0.55)); }
  .hud .eyebrow { color: rgba(242,242,240,0.62); }
  .top, .bottom { display: flex; justify-content: space-between; gap: 1rem; }
  .top { align-items: flex-start; } .bottom { align-items: flex-end; }
  .title { white-space: nowrap; font-size: 1.15rem; font-weight: 650; margin-top: 0.35rem; letter-spacing: -0.01em; }
  .title span { color: rgba(242,242,240,0.6); font-weight: 500; }
  .read { text-align: right; }
  .big { font-size: clamp(2.4rem, 7vw, 4.5rem); font-weight: 620; letter-spacing: -0.035em; line-height: 0.95; color: var(--accent); }
  .big .u { font-size: 0.34em; color: rgba(242,242,240,0.7); font-weight: 500; letter-spacing: 0; margin-left: 0.15em; }
  .sub { color: rgba(242,242,240,0.62); font-size: 0.85rem; margin-top: 0.35rem; white-space: nowrap; }
  .meter { width: 11rem; }
  .meter .track { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); overflow: hidden; margin-top: 0.5rem; }
  .meter .fill { height: 100%; background: var(--accent); }
  .gstat { text-align: right; }
  .gstat .v { font-size: 1.6rem; font-weight: 620; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .gstat .v small { font-size: 0.5em; color: rgba(242,242,240,0.65); font-weight: 500; margin-left: 2px; }
  @media (max-width: 560px) { .meter { width: 8rem; } .gstat .v { font-size: 1.3rem; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud">
  <div class="top">
    <div><div class="eyebrow">Quarry</div><div class="title">Basalt <span>· layer 1 of 5</span></div></div>
    <div class="read"><div class="big num">×12<span class="u">combo</span></div><div class="sub num">clean stroke · 534 N peak</div></div>
  </div>
  <div></div>
  <div class="bottom">
    <div class="meter"><div class="eyebrow">Frenzy</div><div class="track"><div class="fill" style="width:80%"></div></div></div>
    <div class="gstat"><div class="v num">1,284<small>blocks</small></div><div class="sub num">depth 238 m · 0:9:42</div></div>
  </div>
</div>
<script type="module">
import { createRenderer, roomEnvironment } from '../core/gfx.js';
import { createQuarry } from '../screens/quarry/stage.js';
const gfx = createRenderer(document.getElementById('stage'), { quality: 'high' });
const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#00e5ff';
const q = createQuarry({ renderer: gfx.renderer, envMap: roomEnvironment(gfx.renderer), accent, maxShadow: gfx.maxShadow });
q.smash(0.16, 1);
function resize() { gfx.setSize(innerWidth, innerHeight); q.frame(innerWidth, innerHeight); }
addEventListener('resize', resize); resize();
const t0 = performance.now();
function loop(now) { gfx.render(q.scene, q.camera, (now - t0) / 1000); if (!window.__still) requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.__quarry = q.counts; window.__ready = true;
</script>
</body>
</html>
